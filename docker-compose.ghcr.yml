services:
  medihub:
    # 由 .github/workflows/docker-ghcr.yml 构建；首次拉取前确认包为 public，
    # 私有包需要先 docker login ghcr.io。
    image: ghcr.io/eunsolfs/medihub:latest
    container_name: medihub
    restart: unless-stopped
    ports:
      - "${MEDIHUB_PORT:-8080}:3000"
    environment:
      # 生产必须替换：openssl rand -hex 32
      BETTER_AUTH_SECRET: "change-me-to-a-random-32-plus-character-secret"
      BETTER_AUTH_URL: "http://localhost:${MEDIHUB_PORT:-8080}"
      BETTER_AUTH_TRUSTED_ORIGINS: "http://localhost:${MEDIHUB_PORT:-8080},http://127.0.0.1:${MEDIHUB_PORT:-8080}"
      DATABASE_URL: "/data/local.db"
      STORAGE_ROOT: "/data/storage"
      PORT: "3000"
      UPLOAD_MAX_BYTES: "268435456"
    volumes:
      - medihub-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  medihub-data:
