name: docker-ghcr

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read app version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building MediHub v$VERSION"

      - name: Compute lowercase image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medihub" >> "$GITHUB_ENV"
          echo "Image: ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medihub"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.APP_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=医档通 MediHub
            org.opencontainers.image.description=科室多媒体与病历资料管理平台
            org.opencontainers.image.version=${{ env.APP_VERSION }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          trap 'docker rm -f medihub-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name medihub-smoke -p 18080:3000 \
            -e BETTER_AUTH_SECRET="ghcr-smoke-test-secret-at-least-32-characters" \
            -e BETTER_AUTH_URL="http://127.0.0.1:18080" \
            -e BETTER_AUTH_TRUSTED_ORIGINS="http://127.0.0.1:18080" \
            -e DATABASE_URL="/tmp/smoke.db" \
            -e STORAGE_ROOT="/tmp/smoke-storage" \
            "${{ steps.build.outputs.imageid }}"

          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/api/health; then
              echo
              echo "image starts and health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "health check failed; container logs:"
          docker logs medihub-smoke || true
          exit 1
