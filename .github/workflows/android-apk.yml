name: android-apk

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "医档通线上地址（HTTPS）"
        required: false
        default: "https://medihub.summerecho.cn"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm --filter @medihub/web run build

      - name: Resolve server URL
        env:
          INPUT_URL: ${{ inputs.server_url }}
          REPO_URL: ${{ vars.CAPACITOR_SERVER_URL || 'https://medihub.summerecho.cn' }}
        run: |
          URL="${INPUT_URL:-$REPO_URL}"
          if [ -z "$URL" ]; then
            echo "缺少站点地址：workflow_dispatch 时填 server_url，或设置仓库变量 CAPACITOR_SERVER_URL" >&2
            exit 1
          fi
          case "$URL" in
            https://*) ;;
            http://*)
              echo "警告：使用 HTTP，安卓 WebView 的相机/Service Worker 会受限，正式包请用 HTTPS" >&2 ;;
            *) echo "必须是以 http(s):// 开头的地址" >&2; exit 1 ;;
          esac
          echo "CAPACITOR_SERVER_URL=$URL" >> "$GITHUB_ENV"

      - name: Sync Capacitor
        working-directory: apps/mobile
        run: pnpm run sync:android

      - name: Build debug and release APKs
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APK files
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist-apk
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/medihub-${VERSION}-debug.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist-apk/medihub-${VERSION}-release.apk"
          ls -lh dist-apk
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: medihub-apk
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 医档通 MediHub ${{ github.ref_name }}
          files: dist-apk/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
